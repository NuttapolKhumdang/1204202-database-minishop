<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ร้านค้าออนไลน์ — Mini Online Shop</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script>
    const $ = (s) => document.querySelector(s);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
  {% include 'ui/nav.html' %}

  <main class="container">
    <section class="card flex flex-col">
      <h1 id="name" class="text-4xl font-bold pb-2">คำสั่งซื้อ</h1>

      <div class="form-section grid grid-cols-1 gap-2">
        <label class="field">
          <span>ชื่อ</span>
          <input type="text" id="name" value="" disabled />
        </label>

        <label class="field">
          <span>ที่อยู่</span>
          <select id="addresses">
          </select>
        </label>
        </label>

        <label class="field">
          <span>สถานะ</span>
          <select id="status">
            <option id="status-pending" value="pending">กำลังเตรียม</option>
            <option id="status-shipped" value="shipped">กำลังขนส่ง</option>
            <option id="status-complete" value="complete">สำเร็จ</option>
            <option id="status-cancel" value="cancel">ยกเลิก</option>
          </select>
        </label>
      </div>

      <button id="btnSave" class="btn primary">บันทึก</button>

      <section class="form-section my-4 flex flex-col gap-4">
        <span class="font-bold text-xl">รายการสินค้า</span>
        <div id="order-lines" class="flex flex-col"></div>

        <div id="order-summary" class="form-section flex flex-col">
          <div class="grid grid-cols-3 place-items-center py-1  font-bold">
            <p class="font-bold w-full text-left"></p>

            <section class="grid grid-cols-2 place-items-center w-full gap-2">
              <p class="w-full text-left">รวม</p>
              <p class="w-full text-left">ส่วนลด</p>
            </section>
            
            <section class="grid grid-cols-2 place-items-center w-full gap-2">
              <p class="w-full text-left">สุทธิ</p>
              <p class="w-full text-left">แต้มสะสม</p>
            </section>
          </div>
          <div class="grid grid-cols-3 place-items-center py-1  font-bold">
            <p class="font-bold w-full text-left"></p>

            <section class="grid grid-cols-2 place-items-center w-full gap-2">
              <span class="w-full text-left" id="sub_total">รวม</span>
              <span class="w-full text-left" id="discount">ส่วนลด</span>
            </section>

            <section class="grid grid-cols-2 place-items-center w-full gap-2">
              <span class="w-full text-left" id="total">ส่วนลด</span>
              <span class="w-full text-left" id="point">point</span>
            </section>            
            </menu>
          </div>
        </div>

        <nav id="order-editor-adder" class="form-section flex flex-col gap-4">
          <span class="font-bold text-xl">เพิ่มสินค้า</span>

          <section class="grid grid-cols-4 gap-2">
            <label class="field col-span-3">
              <span>ชื่อ</span>
              <input type="text" id="product-search-name" value="" />
            </label>
            <label class="field col-span-3">
              <span>หวมดหมู่สินค้า</span>
              <input type="text" id="product-search-category" value="" />
            </label>
            <label class="field">
              <span>จำนวน</span>
              <input type="number" id="product-search-qty" min="1"  value="1" />
            </label>
          </section>

          <section id="searched-product"></section>
        </nav>
      </section>
    </section>
  </main>

  <script>
    const id = "{{ id }}" ?? undefined;

    let order;
    let addresses;
    let lines = [];
    let searchedProduct = [];

    async function loadEdit() {
      if (!id) return;
      await renderOrderLines();
      await renderOrders();
    }

    if (id) loadEdit();

    async function renderOrders() {
      order = (await (await fetch(`/api/orders/${id}`)).json()).data;
      for (let k of Object.keys(order)) {
        if ($(`input#${k}`)) $(`input#${k}`).value = order[k];
        if ($(`span#${k}`)) $(`span#${k}`).innerHTML = order[k];
      }
      
      $(`span#total`).innerHTML = (order.sub_total - order.discount).toFixed(2);
      $(`option#status-${order.status}`).selected = true;
      
      
      $(`option#status-${order.status}`).selected = true;
      
      const sub_total = order.sub_total;
      const discount = order.discount;
      const total = sub_total - discount;
      const point = total * ( total >= 1000 ? 0.1 : 0.05);
      $(`span#point`).innerHTML = ~~(point);

      addresses = (await (await fetch(`/api/customers/${order.cust_id}/address`)).json()).data;

      $("#addresses").innerHTML = order.address_id ? "" : "<option></option>";

      for (let a of addresses) {
        let address = `${a['บรรทัด 1']} ${a['บรรทัด 2'] ?? ""} ${a['จังหวัด']} ${a['รหัสไปรษณีย์']}`;
        let template = `<option id="address-id-${a.address_id}" value="${a.address_id}">${address}</option>`
        $("#addresses").innerHTML += template;
      }

      if (order.status != "pending") {
        $('#order-editor-adder').classList.add("hidden");
        document.querySelectorAll("#btn-remove-order-lines").forEach(e => e.classList.add("hidden"))
      }
    }

    async function renderOrderLines() {
      lines = (await (await fetch(`/api/orders/${id}/lines`)).json()).data;

      $(`#order-lines`).innerHTML = `
          <div class="grid grid-cols-3 place-items-center py-1  font-bold">
              <p class="font-bold w-full text-left">ชื่อสินค้า</p>

              <section class="grid grid-cols-2 place-items-center w-full gap-2">
                  <p class="w-full text-left">ราคา</p>
                  <p class="w-full text-left">จำนวน</p>
              </section>
                  
              <section class="grid grid-cols-2 place-items-center w-full gap-2">
                <p class="w-full text-left">รวม</p>
              </section>
            </div>`;

      for (let k of lines) {
        $(`#order-lines`).innerHTML += `
            <div class="grid grid-cols-3 place-items-center py-1 border-b border-neutral-200 last:border-0">
              <p class="font-bold w-full text-left">${k.name}</p>

              <section class="grid grid-cols-2 place-items-center w-full gap-2">
                  <p class="w-full text-left">${k.price}</p>
                  <p class="w-full text-left">${k.qty}</p>
              </section>

              <section class="grid grid-cols-2 place-items-center w-full gap-2">
                <p class="w-full text-left">${(Number(k.qty) * Number(k.price)).toLocaleString('en-US')}</p>
                <button class="btn py-0" id="btn-remove-order-lines" onclick="removeLine('${k.product_id}')">ลบ</button>
              </section>
            </div>
            `;
      }
    }

    const removeLine = async (pid) => {
      await fetch(`/api/orders/${order.order_id}/lines/${pid}`, {
        method: "DELETE",
        headers: {
          "Content-Type": "application/json",
        },
      });

      renderOrderLines();
      renderOrders();
    };

    const addLine = async (pid) => {
      await fetch(`/api/orders/${order.order_id}/lines`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          product_id: Number.parseInt(pid),
          qty: Number.parseInt($("#product-search-qty").value),
        }),
      });
      renderOrderLines();
      renderOrders();
      searchProduct();
    };


    let _searchKeyword;
    let _searchCategory;

    async function searchProduct() {
      searchedProduct = (await (await fetch(
        `/api/products?is_active=1` 
        + (_searchKeyword ? `&name=${_searchKeyword}`: '' )
        + (_searchCategory ? `&category=${_searchCategory}`: '')
      )).json()).data;
      renderSearchProduct();
    }

    const renderSearchProduct = () => {
      $("#searched-product").innerHTML = `
          <div class="grid grid-cols-5 place-items-center py-1  font-bold">
              <p class="font-bold w-full text-left">ชื่อสินค้า</p>

              <section class="grid grid-cols-2 place-items-center w-full gap-2">
                  <p class="w-full text-left">ราคา</p>
                  <p class="w-full text-left">คลัง</p>
              </section>
              <section class="grid grid-cols-1 col-span-2 place-items-center w-full gap-2">
                  <p class="w-full text-left">หมวดหมู่</p>
              </section>
              <section class="grid grid-cols-1 place-items-center w-full gap-2">
              </section>
            </div>`;

      for (let p of searchedProduct) {
        if (lines.map((l) => l.product_id).includes(p.product_id)) continue;

        $("#searched-product").innerHTML += `
              <div class="grid grid-cols-5 place-items-center py-1 border-b border-neutral-200">
                  <p class="font-bold w-full text-left">${p.name}</p>

                  <section class="grid grid-cols-2 place-items-center w-full gap-2">
                      <p class="w-full text-left">${p.price}</p>
                      <p class="w-full text-left">${p.stock}</p>
                  </section>

                  <section class="grid grid-cols-1 col-span-2 place-items-center w-full gap-2">
                      <p class="w-full text-left">${p.categories}</p>
                  </section>

                  <section class="grid grid-cols-1 place-items-center w-full gap-2">
                      <button class="btn" onclick="addLine('${p.product_id}')">เพิ่ม</button>
                  </section>
              </div>
            `;
      }
    };

    $("#product-search-name").addEventListener("input", (ev) => {
      _searchKeyword = ev.target.value;
      searchProduct();
    });
    $("#product-search-category").addEventListener("input", (ev) => {
      _searchCategory = ev.target.value;
      searchProduct();
    });

    async function save() {
      const body = {
        status: $("select#status").value,
        address_id: $("select#addresses").value,
      };

      try {
        const r = await (
          await fetch(`/api/orders/` + id, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(body),
          })
        ).json();

        console.log(r);
        if (r.ok) alert("บันทึกสำเร็จ");
        else alert(r.error);

        window.location.reload();
      } catch (e) {
        console.error(e);
        alert(e.message);
      }
    }

    $("#btnSave").onclick = save;
  </script>
</body>

</html>
