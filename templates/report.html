<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>รายงาน — Mini Online Shop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    {% include 'ui/nav.html' %}

    <main class="container">
      <section class="option-container">
        <div></div>
        <select id="rangeSelector" class="option-selecter">
          <option id="rangeOption" value="1d">วันนี้</option>
          <option id="rangeOption" value="7d">สัปดาห์</option>
          <option id="rangeOption" value="1m">1 เดือน</option>
          <option id="rangeOption" value="6m">6 เดือน</option>
          <option id="rangeOption" value="1y">1 ปี</option>
          <option id="rangeOption" value="all">ทั้งหมด</option>
        </select>
      </section>

      <script>
        const filter = new URLSearchParams(window.location.search);
        const rangeSelector = document.querySelector("#rangeSelector");
        const rangeOptions = document.querySelectorAll("option#rangeOption");
        const range = filter.get("range");

        if (range == "all" || !range) rangeOptions[rangeOptions.length - 1].setAttribute("selected", true);

        for (let i = 0; i < rangeOptions.length; i++) {
          if (rangeOptions[i].value == range) {
            rangeOptions[i].setAttribute("selected", true);
            break;
          }
        }

        rangeSelector.addEventListener("change", (ev) => {
          window.location.replace("/report?range=" + ev.target.value);
        });
      </script>

      <section class="cards *:flex-1" id="report"></section>
      <!-- กล่องรายงาน: สร้างจาก db.REPORTS อัตโนมัติ (เพิ่มรายงานที่ db.py ไม่ต้องแก้ไฟล์นี้) -->
      <div id="reports"></div>
    </main>
    <script src="{{ url_for('static', filename='report.js') }}"></script>
  </body>
</html>
